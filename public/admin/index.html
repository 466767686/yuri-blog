<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuriのBlog · 写作后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#222;padding:20px;max-width:860px;margin:0 auto}
h1{font-size:22px;margin:20px 0}
.hidden{display:none!important}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:13px;color:#666;margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit}
textarea{min-height:300px;line-height:1.6;resize:vertical}
button{background:#0a84ff;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer}
button.ghost{background:#eee;color:#333}
button.danger{background:#ff3b30}
.row{display:flex;gap:12px}.row>div{flex:1}
.tip{font-size:12px;color:#999;margin-top:6px}
.post-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.post-item .name{font-size:14px}.post-item .path{font-size:12px;color:#999}
#msg{position:fixed;top:16px;right:16px;padding:12px 18px;border-radius:8px;color:#fff;font-size:14px;display:none;z-index:99}
#msg.ok{background:#34c759}#msg.err{background:#ff3b30}
</style>
</head>
<body>
<h1>YuriのBlog · 写作后台</h1>
<div id="login" class="card">
  <label>后台密码</label>
  <input type="password" id="pwd" placeholder="输入管理密码">
  <div style="margin-top:14px"><button onclick="login()">登录</button></div>
</div>
<div id="panel" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>写新文章</strong><button class="ghost" onclick="logout()">退出</button>
    </div>
    <label>标题 *</label><input id="title" placeholder="文章标题">
    <div class="row">
      <div><label>分类</label><select id="category"><option>随笔</option><option>笔记</option><option>工具</option><option>周刊</option><option>前端</option><option>番剧</option></select></div>
      <div><label>标签（逗号分隔）</label><input id="tags" placeholder="例如：生活, 感想"></div>
    </div>
    <label>链接 slug（可选，留空自动生成）</label><input id="link" placeholder="例如：my-first-post">
    <label>简介（可选）</label><input id="description" placeholder="文章摘要，留空自动截取">
    <label>正文（Markdown）*</label><textarea id="content" placeholder="在这里写正文，支持 Markdown 语法"></textarea>
    <div class="tip">发布后约 1~2 分钟生效（触发 Vercel 重新构建）</div>
    <div style="margin-top:16px"><button onclick="createPost()">发布文章</button></div>
  </div>
  <div class="card">
    <strong>已发布文章</strong>
    <div id="postlist" style="margin-top:8px"><div class="tip">加载中…</div></div>
  </div>
</div>
<div id="msg"></div>
<script>
const API='/api/admin';
let password=localStorage.getItem('admin_pwd')||'';
function toast(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className=ok?'ok':'err';m.style.display='block';setTimeout(()=>m.style.display='none',3000);}
async function call(q){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+password},body:JSON.stringify(q)});const data=await res.json();if(!data.ok)throw new Error(data.error||'请求失败');return data;}
function login(){password=document.getElementById('pwd').value.trim();if(!password)return toast('请输入密码',false);localStorage.setItem('admin_pwd',password);init();}
function logout(){password='';localStorage.removeItem('admin_pwd');document.getElementById('login').classList.remove('hidden');document.getElementById('panel').classList.add('hidden');}
async function init(){if(!password){document.getElementById('login').classList.remove('hidden');return;}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');try{await listPosts();}catch(e){if(e.message.includes('401')){logout();toast('密码错误',false);}}}
async function listPosts(){try{const data=await call({action:'list'});const list=document.getElementById('postlist');const items=(data.posts||[]).filter(p=>p.type==='file'&&p.name.endsWith('.md'));if(!items.length){list.innerHTML='<div class="tip">还没有文章</div>';return;}list.innerHTML=items.map(p=>`<div class="post-item"><div><div class="name">${p.name}</div><div class="path">${p.path}</div></div><button class="danger" onclick="del('${p.path}')">删除</button></div>`).join('');}catch(e){toast(e.message,false);}}
async function createPost(){const title=document.getElementById('title').value.trim();const content=document.getElementById('content').value.trim();if(!title||!content)return toast('标题和正文不能为空',false);const category=document.getElementById('category').value;const tags=document.getElementById('tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);const link=document.getElementById('link').value.trim();const description=document.getElementById('description').value.trim();try{await call({action:'create',title,content,category,tags,link,description});toast('发布成功！约 1~2 分钟后上线',true);document.getElementById('title').value='';document.getElementById('content').value='';document.getElementById('tags').value='';document.getElementById('link').value='';document.getElementById('description').value='';await listPosts();}catch(e){toast(e.message,false);}}
async function del(path){if(!confirm('确定删除这篇文章？'))return;const m=path.match(/blog\/([^/]+)\/([^/]+)\.md$/);const link=m?m[2]:'';const cat=path.includes('note/front-end')?'前端':(path.includes('/life/')?'随笔':(path.includes('/note/')?'笔记':(path.includes('/tools/')?'工具':'周刊')));try{await call({action:'delete',category:cat,link});toast('已删除',true);await listPosts();}catch(e){toast(e.message,false);}}
init();
</script>
</body>
</html>
