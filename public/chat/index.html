<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和 Yuri 聊聊天 · YuriのBlog</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#fdf2f4,#eef4ff);min-height:100vh;display:flex;flex-direction:column;color:#333}
header{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(0,0,0,.06)}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
header .name{font-weight:600}
header .sub{font-size:12px;color:#999}
a.back{margin-left:auto;font-size:13px;color:#e9536a;text-decoration:none}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#e9536a;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.typing{align-self:flex-start;color:#aaa;font-size:13px}
footer{padding:12px 16px;display:flex;gap:8px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-top:1px solid rgba(0,0,0,.06)}
footer input{flex:1;padding:11px 14px;border:1px solid #e2e2e2;border-radius:22px;font-size:14px;outline:none}
footer button{background:#e9536a;color:#fff;border:none;border-radius:22px;padding:0 20px;font-size:14px;cursor:pointer}
footer button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <img src="/img/avatar.webp" alt="">
  <div><div class="name">Yuri</div><div class="sub">AI 分身 · 随时找我聊</div></div>
  <a class="back" href="/">← 回博客</a>
</header>
<div id="chat"></div>
<footer>
  <input id="input" placeholder="说点什么…" autocomplete="off">
  <button id="send">发送</button>
</footer>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send');
let history=[];
function add(text,who){const d=document.createElement('div');d.className='msg '+(who==='me'?'me':'ai');d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function submit(){
  const text=input.value.trim(); if(!text) return;
  input.value=''; add(text,'me'); history.push({role:'user',content:text});
  send.disabled=true;
  const t=document.createElement('div');t.className='typing';t.textContent='正在输入…';chat.appendChild(t);chat.scrollTop=chat.scrollHeight;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const d=await r.json();
    t.remove();
    if(d.ok){ add(d.reply,'ai'); history.push({role:'assistant',content:d.reply}); }
    else { add('（出错了：'+(d.error||'未知')+'）','ai'); }
  }catch(e){ t.remove(); add('（网络错误）','ai'); }
  send.disabled=false; input.focus();
}
send.onclick=submit;
input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
add('你好，我是 Yuri 的 AI 分身。有什么想聊的？比如问我喜欢的 Galgame、最近在折腾什么，或者随便聊聊 ✨','ai');
</script>
</body>
</html>
