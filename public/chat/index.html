<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e9536a">
<title>和 Yuri 聊聊天 · YuriのBlog</title>
<style>
:root{
  --brand:#e9536a; --brand-deep:#c73e54; --brand-soft:#f9a8b8;
  --bg1:#fdf3f5; --bg2:#eef3ff; --card:#fff; --ink:#2a2024; --muted:#8d8087;
  --line:rgba(40,20,30,.08); --bubble:#fff; --bubble-ink:#2a2024;
  --shadow:0 8px 28px -20px rgba(80,30,50,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#191215; --bg2:#151a24; --card:#211a1e; --ink:#f1e8ec; --muted:#a2929a;
    --line:rgba(255,255,255,.08); --bubble:#241c21; --bubble-ink:#f1e8ec;
    --shadow:0 8px 28px -20px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
header{
  display:flex;align-items:center;gap:11px;padding:12px 16px;
  background:color-mix(in srgb,var(--card) 75%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top));
}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow)}
.hd{flex:1;min-width:0}
.hd .name{font-size:15px;font-weight:600;letter-spacing:.02em}
.hd .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#34c759;display:inline-block}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .16s,color .16s;flex:0 0 auto;
}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
#chat{
  flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;
}
#chat::before{content:'';margin-top:auto}
.row{display:flex;gap:9px;align-items:flex-end;width:100%}
.row.me{justify-content:flex-end}
.row{display:flex;width:100%}
.row.me{justify-content:flex-end}
.row.ai{justify-content:flex-start}
.ava{width:28px;height:28px;border-radius:50%;flex:0 0 28px;object-fit:cover;margin-bottom:2px}
.bubble{
  display:block;flex:0 1 auto;width:max-content;min-width:0;max-width:min(78%,520px);padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.7;
  background:var(--bubble);color:var(--bubble-ink);box-shadow:var(--shadow);
  word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
}
.row.me .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}

.row.ai .bubble{border-bottom-left-radius:5px}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.bubble code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  background:color-mix(in srgb,var(--brand) 10%,transparent);padding:1.5px 5px;border-radius:5px;
}
.bubble pre{
  margin:8px 0;padding:10px 12px;border-radius:10px;overflow-x:auto;
  background:rgba(0,0,0,.06);font-size:13px;line-height:1.55;
}
.bubble pre code{background:none;padding:0;font-size:inherit}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.time{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;opacity:.72;text-align:right;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row.me .time{color:rgba(255,255,255,.82);opacity:1}
.cursor{display:inline-block;width:2px;height:1em;vertical-align:-2px;background:var(--brand);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.chips{display:flex;gap:8px;padding:0 14px 2px;flex-wrap:wrap;justify-content:center}
.chips.hide{display:none}
.chip{
  font-size:12.5px;padding:7px 13px;border-radius:999px;color:var(--brand-deep);
  background:color-mix(in srgb,var(--brand) 9%,var(--card));
  border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);
  transition:transform .16s,background .16s;
}
.chip:hover{background:color-mix(in srgb,var(--brand) 16%,var(--card))}
.chip:active{transform:scale(.96)}
footer{
  display:flex;gap:9px;align-items:flex-end;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 80%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
}
#input{
  flex:1;resize:none;max-height:132px;min-height:44px;
  padding:11px 15px;border-radius:22px;border:1px solid var(--line);
  background:var(--bubble);color:var(--ink);font-size:14.5px;line-height:1.5;outline:none;
  transition:border-color .16s,box-shadow .16s;
}
#input:focus{border-color:var(--brand-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent)}
#send{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s,opacity .16s,background .16s;
}
#send:disabled{opacity:.42}
#send:active{transform:scale(.94)}
#send svg{width:19px;height:19px}
#send.busy{background:var(--brand-deep)}
.retry{font-size:12.5px;color:var(--brand-deep);margin-top:6px;text-decoration:underline;text-underline-offset:2px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 10px;line-height:1.9}
@media (max-width:420px){
  .bubble{max-width:84%;font-size:14px}
  header img{width:36px;height:36px}
}

/* ── iOS 风格动效 ── */
:root{--spring:cubic-bezier(.22,1.2,.36,1);--spring-soft:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.25,.1,.25,1)}

@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dotPulse{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes liveDot{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}55%{box-shadow:0 0 0 5px rgba(52,199,89,0)}}
@keyframes cursorFade{from{opacity:0}to{opacity:1}}

.row{will-change:auto}
.bubble{transition:transform .22s var(--spring-soft),box-shadow .25s var(--ease)}
.bubble:active{transform:scale(.985)}
.ava{background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.dot{animation:liveDot 2.6s var(--ease) infinite}
.cursor{animation:cursorFade .18s var(--ease) both,blink 1s steps(1) infinite}

.chips{animation:fadeUp .45s var(--ease) both}
.chip{animation:fadeUp .42s var(--spring) both;transition:transform .24s var(--spring-soft),background .2s var(--ease),box-shadow .2s}
.chip:nth-child(1){animation-delay:.05s}
.chip:nth-child(2){animation-delay:.1s}
.chip:nth-child(3){animation-delay:.15s}
.chip:nth-child(4){animation-delay:.2s}
.chip:active{transform:scale(.94)}

.icon-btn{transition:transform .3s var(--spring-soft),background .18s,color .18s}
.icon-btn:active{transform:scale(.88)}
header{transition:box-shadow .3s var(--ease),background .3s}
header.scrolled{box-shadow:0 1px 12px -6px rgba(60,30,45,.28);background:color-mix(in srgb,var(--card) 92%,transparent)}

#send{transition:transform .28s var(--spring-soft),background .2s,opacity .2s,box-shadow .25s}
#send:active{transform:scale(.88)}
#send:not(:disabled):hover{box-shadow:0 6px 18px -8px color-mix(in srgb,var(--brand) 80%,transparent)}
#send.busy{animation:sendPulse 1.4s var(--ease) infinite}
@keyframes sendPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 28%,transparent)}50%{box-shadow:0 0 0 7px transparent}}

#input{transition:border-color .2s,box-shadow .25s,transform .3s var(--spring-soft)}
#input:focus{transform:translateY(-1px);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 12%,transparent),0 10px 22px -18px rgba(80,30,50,.5)}

/* 三点打字指示 */
.typing{display:flex;align-items:center;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dotPulse 1.25s var(--ease) infinite}
.typing i:nth-child(2){animation-delay:.14s}
.typing i:nth-child(3){animation-delay:.28s}

/* 内容进场用消息级动画，避免整页依赖动画初始状态 */
#chat{opacity:1}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header>
  <img src="/img/avatar.webp" alt="Yuri">
  <div class="hd">
    <div class="name">Yuri</div>
    <div class="sub"><span class="dot"></span>AI 分身 · 随时聊</div>
  </div>
  <button class="icon-btn" id="newChat" title="新对话" aria-label="新对话">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <a class="icon-btn" href="/" title="回博客" aria-label="回博客">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </a>
</header>

<div id="chat" role="log" aria-live="polite" aria-label="聊天记录"></div>

<div class="chips" id="chips">
  <button class="chip">最近在玩什么</button>
  <button class="chip">素晴日怎么样</button>
  <button class="chip">高三累不累</button>
  <button class="chip">帮我推荐一部 galgame</button>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="说点什么…" aria-label="输入消息"></textarea>
  <button id="send" aria-label="发送消息" title="发送">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
  </button>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const chatEl = $('#chat'), input = $('#input'), sendBtn = $('#send'), chips = $('#chips');
const KEY = 'yuri_chat_v2';
const GREETING = '你好，我是 Yuri 的 AI 分身。想聊点什么？Galgame、最近在折腾的东西，或者就随便说说话，都行。';

let history = [];
let busy = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fmtTime(ts) {
  const d = new Date(ts || Date.now());
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/** 轻量 Markdown：代码块、行内代码、粗体、链接、列表 */
function renderMarkdown(text) {
  const blocks = [];
  let s = String(text || '').replace(/```([\s\S]*?)```/g, (_m, code) => {
    blocks.push(`<pre><code>${esc(String(code).replace(/\n$/, ''))}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(https?:\/\/[^\s<）)]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/^[ \t]*[-*][ \t]+/gm, '· ');
  s = s.replace(/\u0000(\d+)\u0000/g, (_m, i) => blocks[Number(i)]);
  return s;
}

function prefersReduced() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function nearBottom() {
  return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 140;
}

function scrollDown(force) {
  if (force || nearBottom()) chatEl.scrollTop = chatEl.scrollHeight;
}

function addBubble(role, text, noAnim) {
  const row = document.createElement('div');
  row.className = `row ${role === 'user' ? 'me' : 'ai'}${noAnim ? ' no-anim' : ''}`;
  if (role !== 'user') {
    const ava = document.createElement('img');
    ava.className = 'ava';
    ava.src = '/img/avatar.webp';
    ava.alt = '';
    row.appendChild(ava);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const body = document.createElement('div');
  body.innerHTML = role === 'user' ? esc(text) : renderMarkdown(text);
  bubble.appendChild(body);
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = fmtTime();
  bubble.appendChild(time);
  row.appendChild(bubble);
  chatEl.appendChild(row);
  if (!noAnim && row.animate && !prefersReduced()) {
    row.animate(
      [
        { opacity: 0, transform: 'translateY(14px) scale(.975)' },
        { opacity: 1, transform: 'none' },
      ],
      { duration: 440, easing: 'cubic-bezier(.22,1.2,.36,1)' }
    );
  }
  return { row, bubble, time };
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(history.slice(-40)));
  } catch {}
}

function push(role, text) {
  history.push({ role, content: text, ts: Date.now() });
  addBubble(role, text);
  save();
  scrollDown(true);
}

function load() {
  let saved = [];
  try {
    saved = JSON.parse(localStorage.getItem(KEY) || '[]');
  } catch {
    saved = [];
  }
  history = Array.isArray(saved) ? saved.filter((m) => m && m.content) : [];
  chatEl.innerHTML = '';
  if (!history.length) {
    addBubble('assistant', GREETING);
    chips.classList.remove('hide');
    return;
  }
  chips.classList.add('hide');
  for (const m of history) {
    const node = addBubble(m.role === 'user' ? 'user' : 'assistant', m.content, true);
    if (m.ts && node.time) node.time.textContent = fmtTime(m.ts);
  }
  scrollDown(true);
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'row ai';
  const ava = document.createElement('img');
  ava.className = 'ava';
  ava.src = '/img/avatar.webp';
  ava.alt = '';
  const dots = document.createElement('div');
  dots.className = 'bubble typing';
  dots.innerHTML = '<i></i><i></i><i></i>';
  row.appendChild(ava);
  row.appendChild(dots);
  chatEl.appendChild(row);
  scrollDown(true);
  return row;
}

async function send(raw) {
  const text = String(raw || '').trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  sendBtn.classList.add('busy');
  chips.classList.add('hide');

  push('user', text);
  input.value = '';
  autoGrow();

  const typing = addTyping();
  const messages = history.slice(-10).map((m) => ({ role: m.role, content: m.content }));

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stream: true, messages }),
    });

    const isStream = String(res.headers.get('content-type') || '').includes('text/event-stream');
    if (!res.ok || !isStream) {
      const data = await res.json().catch(() => ({}));
      typing.remove();
      if (!data.ok || !data.reply) throw new Error(data.error || `请求失败（${res.status}）`);
      push('assistant', data.reply);
      return;
    }

    typing.remove();
    const node = addBubble('assistant', '');
    let acc = '';
    let finished = false;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (!finished) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop() || '';
      for (const part of parts) {
        const line = part.split('\n').find((l) => l.startsWith('data:'));
        if (!line) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let evt;
        try {
          evt = JSON.parse(payload);
        } catch {
          continue;
        }
        if (evt.error) throw new Error(evt.error);
        if (evt.delta) {
          acc += evt.delta;
          node.bubble.innerHTML = renderMarkdown(acc) + '<span class="cursor"></span>';
          scrollDown();
        }
        if (evt.done) finished = true;
      }
    }

    node.bubble.innerHTML = renderMarkdown(acc || '（这次没说出话来，再问一次试试）');
    if (acc) {
      history.push({ role: 'assistant', content: acc, ts: Date.now() });
      save();
    }
    scrollDown();
  } catch (e) {
    typing.remove();
    const node = addBubble('assistant', `（${e.message || '出错了，稍后再试'}）`);
    const retry = document.createElement('button');
    retry.className = 'retry';
    retry.textContent = '重试这条';
    retry.onclick = () => {
      node.row.remove();
      history.pop();
      save();
      send(text);
    };
    node.bubble.appendChild(document.createElement('br'));
    node.bubble.appendChild(retry);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    sendBtn.classList.remove('busy');
    input.focus();
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 132) + 'px';
}

sendBtn.addEventListener('click', () => send(input.value));
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send(input.value);
  }
});

chips.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) send(chip.textContent);
});

$('#newChat').addEventListener('click', () => {
  if (busy) return;
  if (history.length && !confirm('清空当前对话，开始新的一段？')) return;
  history = [];
  try {
    localStorage.removeItem(KEY);
  } catch {}
  chatEl.innerHTML = '';
  addBubble('assistant', GREETING);
  chips.classList.remove('hide');
  input.focus();
});

chatEl.addEventListener(
  'scroll',
  () => {
    const hd = document.querySelector('header');
    if (hd) hd.classList.toggle('scrolled', chatEl.scrollTop > 4);
  },
  { passive: true }
);

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => scrollDown(true));
}

load();
autoGrow();
</script>
</body>
</html>
